function databasePatch(table,old,next){
 const out={};const put=(key,value,field=key)=>{if(!old||JSON.stringify(old[field])!==JSON.stringify(next[field]))out[key]=value;};
 if(table==='tasks'){
  put('title',next.text,'text');put('assignee',next.assignee);put('category',next.category);put('priority',next.priority);put('status',next.status);put('deadline_at',next.deadline||null,'deadline');put('attachments',next.attachments||'');put('rejection_reason',next.rejection_reason||'');
  if(!old||JSON.stringify(old.checklist)!==JSON.stringify(next.checklist))out.checklist=(next.checklist||[]).map((c,i)=>{const raw=old?._raw?.checklist?.[i];return raw&&(raw.title??raw.text??'')===c.text?{...raw,done:!!c.done}:{id:c.id||uid(),title:c.text,done:!!c.done};});
  if(!old){out.task_id='BT-'+uid();delete out.status;}
 }else if(table==='goals'){
  for(const k of ['title','description','deadline','target_type','assignee_name'])put(k,k==='description'?(next[k]||''):k==='deadline'?(next[k]?.slice(0,10)||null):(next[k]||null));
  if(!old){out.season=next.season||'Сезон '+new Date().getFullYear();out.target_value=next.target_value||100;out.metric=next.metric||'%';}
  if(!old||old.progress!==next.progress)out.current_value=Math.round(Number(next.progress)*(old?.target_value||out.target_value||100)/100);
 }else if(table==='ideas'){
  put('title',next.title);put('description',next.text,'text');put('status',next.status);put('likes',next.likes||[]);
  if(!old){out.author=next.author;out.category='Общее';delete out.status;delete out.likes;}
 }else if(table==='notes'){
  put('content',next.text,'text');if(!old){out.title=next.text.slice(0,80)||'Заметка';out.user_login=next.user_login;}
 }else if(table==='users'){
  for(const k of ['role','is_active','auth_id','telegram','position','is_assignee'])put(k,next[k]??(k==='auth_id'?null:''));
  if(!old){out.login=next.login;out.name=next.name;}
 }
 return out;
}

{modal.type.startsWith('delete')&&<><p className="muted">{modal.type==='deleteTask'?'Задача '+(modal.task.task_id||modal.task.id)+' и её история будут удалены из базы. Отменить действие нельзя.':'Запись будет удалена из базы. Отменить действие нельзя.'}</p><div className="modalfoot"><Btn onClick={close}>Отмена</Btn><Btn kind="danger" icon="trash-2" onClick={()=>{const map={deleteTask:['tasks',modal.task,admin],deleteGoal:['goals',modal.goal,manager],deleteIdea:['ideas',modal.idea,manager],deleteNote:['notes',modal.note,modal.note?.user_login===user.login]};const [key,item,ok]=map[modal.type];if(ok)commit(d=>({...d,[key]:d[key].filter(x=>x.id!==item.id)}));close();notify(ok?'Запись удалена':'Недостаточно прав')}}>Удалить</Btn></div></>}
{modal.type==='idea'&&<IdeaForm close={close} save={f=>{commit(d=>({...d,ideas:[{...f,id:uid(),author:user.name,user_login:user.login,status:'На рассмотрении',likes:[],created_at:iso()},...d.ideas]}));close();notify('Идея отправлена на рассмотрение')}}/>}
{modal.type==='note'&&<TextForm label="Личная заметка" initial={modal.note?.text||''} close={close} save={text=>{commit(d=>({...d,notes:modal.note?d.notes.map(n=>n.id===modal.note.id&&n.user_login===user.login?{...n,text,updated_at:iso()}:n):[{id:uid(),user_login:user.login,text,updated_at:iso()},...d.notes]}));close();notify('Заметка сохранена')}}/>}
{modal.type==='person'&&admin&&<UserForm person={modal.person} users={db.users} close={close} save={p=>{commit(d=>({...d,users:modal.person?d.users.map(u=>u.id===modal.person.id?{...u,...p}:u):[...d.users,{...p,id:uid()}],tasks:d.tasks,goals:d.goals}));close();notify('Профиль обновлён')}}/>}

{modal.type==='password'&&<TextForm label="Новый пароль (минимум 12 символов)" password close={close} save={async p=>{const {error}=await sb.auth.updateUser({password:p});if(error){notify(connectionError(error));return;}close();notify('Пароль изменён')}}/>}
{modal.type==='connection'&&<Connection/>}
</Modal>}{toast&&<div className="toast" role="status">{toast}</div>}</>}
function IdeaForm({save,close}){const [title,T]=useState(''),[text,S]=useState('');return <form className="stack" onSubmit={e=>{e.preventDefault();if(title.trim()&&text.trim())save({title:title.trim(),text:text.trim()})}}><Field label="Короткое название"><input required maxLength="160" className="input" value={title} onChange={e=>T(e.target.value)}/></Field><Field label="Идея и ожидаемая польза"><textarea required maxLength="4000" className="input" value={text} onChange={e=>S(e.target.value)}/></Field><div className="modalfoot"><Btn onClick={close}>Отмена</Btn><button className="btn primary">Предложить</button></div></form>}
function Connection(){return <div className="stack"><p>Сайт использует Supabase Auth и общую базу компании. Права на чтение и изменение записей проверяются базой.</p><p className="connection">Рабочая база подключена. Если данные не загружаются после входа, обратитесь к администратору: он проверит активность и связь вашего аккаунта с профилем.</p><p className="muted">Создание аккаунтов и восстановление доступа сотрудников пока выполняются в панели Supabase.</p></div>}
function Login({onLogin,connection,errorMessage}){const [email,E]=useState(''),[password,P]=useState(''),[error,Err]=useState(''),[busy,B]=useState(false);async function enter(e){e.preventDefault();B(true);Err('');try{if(!sb)throw Error('Не загрузился клиент Supabase. Обновите страницу.');const {error}=await sb.auth.signInWithPassword({email:email.trim(),password});if(error)throw error;await onLogin();P('');}catch(e){Err(e?.code==='invalid_credentials'?'Неверная почта или пароль':connectionError(e));}finally{B(false);}}return <main className="glass login"><div className="row"><img className="brand-logo" src="/assets/benoy-travel-logo.png" width="64" height="64" alt="Беной Тревел"/><div className="brand">BENOY TRAVEL<small>КОМАНДА КАВКАЗА</small></div></div><h1>Рабочее пространство<br/>Benoy Travel.</h1><p className="muted" style={{fontSize:14}}>Войдите с почтой и паролем вашего рабочего аккаунта.</p><form onSubmit={enter}><Field label="Электронная почта"><input type="email" required autoComplete="username" className="input" value={email} onChange={e=>E(e.target.value)}/></Field><Field label="Пароль"><input type="password" required autoComplete="current-password" className="input" value={password} onChange={e=>P(e.target.value)}/></Field>{(error||errorMessage)&&<p className="error" role="alert">{error||errorMessage}</p>}<button disabled={busy} className="btn primary">{busy?'Входим…':'Войти'}</button></form><button className="btn" style={{marginTop:16,width:'100%'}} onClick={connection}>Информация о подключении</button><p className="muted mini" style={{marginTop:16}}>Нет аккаунта или забыли пароль? Обратитесь к администратору компании.</p></main>}
window.BenoyDomain={overdue,urgency,isManager,isAdmin,safeLink,blankDB,normalizeRow,databasePatch,workspaceChanges,selectReportTasks};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
