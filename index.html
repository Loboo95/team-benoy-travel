async function readWorkspace(){

  if(error)throw error;
  if(!data.user)throw Error('Войдите в систему');
  const users=await readRows('users');
  const me=users.find(u=>u.auth_id===data.user.id);
  if(!me)throw Error('Аккаунт ещё не связан с профилем сотрудника');
  if(!me.is_active)throw Error('Учетная запись деактивирована администратором');

  return {login:me.login,db:{users,...Object.fromEntries(['tasks','goals','ideas','notes'].map((t,i)=>[t,rows[i]]))}};

function databasePatch(table,old,next){
  const out={};const put=(key,value,field=key)=>{if(!old||JSON.stringify(old[field])!==JSON.stringify(next[field]))out[key]=value;};
  if(table==='tasks'){
    put('title',next.text,'text');put('assignee',next.assignee);put('category',next.category);put('priority',next.priority);put('status',next.status);put('deadline_at',next.deadline||null,'deadline');put('attachments',next.attachments||'');put('rejection_reason',next.rejection_reason||'');
    if(!old||JSON.stringify(old.checklist)!==JSON.stringify(next.checklist))out.checklist=(next.checklist||[]).map((c,i)=>{const raw=old?._raw?.checklist?.[i];return raw&&(raw.title??raw.text??'')===c.text?{...raw,done:!!c.done}:{id:c.id||uid(),title:c.text,done:!!c.done};});
    if(!old){out.task_id='BT-'+uid();delete out.status;}
  }else if(table==='goals'){
    for(const k of ['title','description','deadline','target_type','assignee_name'])put(k,k==='description'?(next[k]||''):k==='deadline'?(next[k]?.slice(0,10)||null):(next[k]||null));
    if(!old){out.season=next.season||'Сезон '+new Date().getFullYear();out.target_value=next.target_value||100;out.metric=next.metric||'%';}
    if(!old||old.progress!==next.progress)out.current_value=Math.round(Number(next.progress)*(old?.target_value||out.target_value||100)/100);
  }else if(table==='ideas'){
    put('title',next.title);put('description',next.text,'text');put('status',next.status);put('likes',next.likes||[]);
    if(!old){out.author=next.author;out.category='Общее';delete out.status;delete out.likes;}
  }else if(table==='notes'){
    put('content',next.text,'text');if(!old){out.title=next.text.slice(0,80)||'Заметка';out.user_login=next.user_login;}
  }else if(table==='users'){
    for(const k of ['role','is_active','auth_id','telegram','position','is_assignee'])put(k,next[k]??(k==='auth_id'?null:''));
    if(!old){out.login=next.login;out.name=next.name;}
  }
  return out;
}

function workspaceChanges(before,after){const changes=[];for(const table of ['users','tasks','goals','ideas','notes']){const old=new Map(before[table].map(r=>[r.id,r]));for(const row of after[table]){const prior=old.get(row.id);const payload=databasePatch(table,prior,row);if(Object.keys(payload).length)changes.push({table,old:prior,payload,action:prior?'update':'insert'});old.delete(row.id);}for(const row of old.values())changes.push({table,old:row,action:'delete'});}return changes;}
async function saveWorkspace(before,after){const changes=workspaceChanges(before,after);if(!changes.length)return;if(changes.length!==1)throw Error('Сохраните изменения одной записи за раз');const c=changes[0];let query=sb.from(c.table);if(c.action==='insert')query=query.insert(c.payload);else if(c.action==='update')query=query.update(c.payload).eq('id',c.old.id).eq('revision',c.old.revision);else query=query.delete().eq('id',c.old.id).eq('revision',c.old.revision);const {data,error}=await query.select('id');if(error)throw error;if(data?.length!==1)throw Error('Запись изменена другим пользователем или доступ ограничен. Обновите данные.');}

      {t.rejection_reason&&t.status==='В работе'&&<div className="notification">На доработку: {t.rejection_reason}</div>}
      {checks.length>0&&<div style={{marginTop:16}}><div className="between mini muted" style={{marginBottom:6}}><span className="row"><Icon name="list-checks" size={14}/>Чек-лист</span><span>{done}/{checks.length}</span></div><div className="progress"><span style={{width:100*done/checks.length+'%'}}/></div><details style={{marginTop:8}}><summary>Показать пункты</summary>{checks.map((c,i)=><label key={c.id||i} className="checkrow"><input type="checkbox" checked={!!c.done} disabled={!canEdit} onChange={()=>updateTask(t,{checklist:checks.map((x,j)=>i===j?{...x,done:!x.done}:x)})}/><span style={{textDecoration:c.done?'line-through':'none'}}>{c.text}</span></label>)}</details></div>}
      <div className="between taskfooter"><div className="row"><span className="avatar">{initials(t.assignee)}</span><span className="assignee">{t.assignee}</span></div><span className="row taskmeta"><Icon name="calendar-days" size={14}/>{fmt(t.deadline)}</span></div>
      <div className="taskactions">
        {safeLink(t.attachments)&&<a className="btn" href={safeLink(t.attachments)} target="_blank" rel="noopener noreferrer"><Icon name="paperclip" size={14}/>Материалы</a>}
        {u?.telegram?<a className="btn" href={'https://t.me/'+u.telegram.replace('@','')} target="_blank" rel="noopener noreferrer"><Icon name="send" size={14}/>Telegram</a>:<Btn icon="send" onClick={()=>notify('Telegram исполнителя ещё не указан в профиле')}>Связаться</Btn>}
        {manager&&<Btn icon="pencil" onClick={()=>Q({type:'task',task:t})}>Редактировать</Btn>}
        {canEdit&&t.status==='К выполнению'&&<Btn onClick={()=>updateTask(t,{status:'В работе'})}>В работу</Btn>}
        {canEdit&&t.status==='В работе'&&<Btn onClick={()=>updateTask(t,{status:'На проверке'})}>На проверку</Btn>}
        {manager&&t.status==='На проверке'&&<><Btn kind="primary" icon="check" onClick={()=>updateTask(t,{status:'Выполнена',completed_at:iso(),rejection_reason:'',history:[...(t.history||[]),audit(user,'Результат принят')]})}>Принять</Btn><Btn onClick={()=>Q({type:'reject',task:t})}>На доработку</Btn></>}
        {admin&&<Btn kind="danger" icon="trash-2" aria-label="Удалить задачу" onClick={()=>Q({type:'deleteTask',task:t})}/>}
      </div>
    </article>;
  }

  // 5 понятных карточек
  const stats=(list)=>{
    let n=list.length;
    let done=list.filter(t=>t.status==='Выполнена').length;
    let review=list.filter(t=>t.status==='На проверке').length;
    let late=list.filter(overdue).length;
    let active=list.filter(t=>!overdue(t)&&['К выполнению','В работе'].includes(t.status)).length;
    return [
      {key:'all',label:'Всего задач',value:n,sub:'В периоде',icon:'layers',color:'#a1b2ca'},
      {key:'active',label:'В работе',value:active,sub:'По графику',icon:'activity',color:'#38bdf8'},
      {key:'review',label:'На утверждении',value:review,sub:'Ждут приёмки',icon:'clock',color:'#c4b5fd'},
      {key:'late',label:'Просрочено',value:late,sub:'Требуют внимания',icon:'triangle-alert',color:'#fb7185'},
      {key:'done',label:'Выполнено',value:done,sub:(n?Math.round(done/n*100):0)+'%',icon:'circle-check',color:'#10b981'}
    ];
  };

  const kpis=list=><div className="stats">{stats(list).map(s=><button className={'stat '+(filter===s.key?'selected':'')} key={s.key} onClick={()=>Filter(s.key)}><div className="between"><span className="label">{s.label}</span><span style={{color:s.color}}><Icon name={s.icon}/></span></div><div className="value" style={{color:s.key==='late'&&s.value?'#fb7185':s.key==='review'&&s.value?'#c4b5fd':undefined}}>{s.value.toString().padStart(2,'0')}</div><small>{s.sub}</small></button>)}</div>;

  const reportBase=selectReportTasks(allowedTasks,{year,month,category:cat,status:reportStatus});
  const reportList=reportBase.filter(t=>{
    if(filter==='all') return true;
    if(filter==='active') return !overdue(t) && ['К выполнению','В работе'].includes(t.status);
    if(filter==='review') return t.status==='На проверке';
    if(filter==='late') return overdue(t);
    if(filter==='done') return t.status==='Выполнена';
    return true;
  });

  function exportCSV(){
    const esc=v=>'"'+String(v??'').replace(/^[=+\-@\t\r]/,"'$&").replaceAll('"','""')+'"';
    const rows=[['ID','Задача','Исполнитель','Направление','Статус','Дедлайн','Приоритет','Выполнено'],...reportList.map(t=>[t.id,t.text,t.assignee,t.category,t.status,t.deadline,t.priority,t.completed_at])];
    const b=new Blob(['\uFEFF'+rows.map(r=>r.map(esc).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download='team-Benoy-Travel-'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('CSV скачан');
  }

  const switchTab=t=>{T(t);Filter('all');Cat('');S('all');if(t==='reports'){Y('all');Mo('all');RS('');}window.scrollTo({top:0,behavior:'smooth'});};
  const pending=db.ideas.filter(i=>i.status==='На рассмотрении').length;

  if(!user) return <><Login onLogin={refresh} errorMessage={loadError} connection={()=>Q({type:'connection'})}/>{modal?.type==='connection'&&<Modal title="Подключение базы" close={close}><Connection/></Modal>}</>;

  return <>
    <header className="topbar">
      <div className="row">
        <img className="brand-logo" src="./assets/benoy-travel-logo.png" width="56" height="56" alt="team Benoy Travel"/>
        <div className="brand">team <span style={{fontWeight:350}}>Benoy Travel</span><small>КОРПОРАТИВНАЯ СИСТЕМА</small></div>
      </div>
      <div className="row muted desktop" style={{fontSize:13}}><Icon name="calendar-days" size={15}/>{new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}</div>
      <button className="profilebtn" onClick={()=>Q({type:'profile'})}>
        <span className="avatar">{initials(user.name)}</span>
        <span className="desktop" style={{fontSize:13}}>{user.name}<small className="muted" style={{display:'block',fontSize:11}}>{admin?'SuperAdmin':manager?'Руководство':'Сотрудник'}</small></span>
        <Icon name="chevron-down" size={16}/>
      </button>
    </header>

    <main className="shell">
      <div className="demo"><span>{busy?'Синхронизация…':'База Supabase подключена'}</span><button disabled={busy} onClick={()=>refresh().catch(()=>{})}>Обновить данные</button></div>
      {loadError&&<div className="notification" role="alert">{loadError}</div>}

      {/* Вкладка 1: Задачи */}
      {tab==='tasks'&&<>
        <div className="between pagehead">
          <div><p className="eyebrow">Рабочее пространство</p><h1>{manager?'Задачи команды':'Мои задачи'}</h1><p className="subtitle">От идеи до результата — всё под контролем.</p></div>
          {manager&&<Btn kind="primary" icon="plus" onClick={()=>Q({type:'task'})}><span className="desktop">Назначить </span>задачу</Btn>}
        </div>
        {kpis(base)}
        <div className="toolbar">
          {manager?<div className="segment"><button className={scope==='all'?'active':''} onClick={()=>S('all')}>Все задачи</button><button className={scope==='mine'?'active':''} onClick={()=>S('mine')}>Мои поручения</button></div>:<span/>}
          <div className="segment"><button className={mode==='list'?'active':''} onClick={()=>M('list')}><Icon name="list" size={16}/>Список</button><button className={mode==='kanban'?'active':''} onClick={()=>M('kanban')}><Icon name="columns-3" size={16}/>Канбан</button></div>
        </div>
        <div className="between wrap" style={{marginBottom:16}}>
          <h3>{filter==='review'?'Задачи на утверждении':filter==='late'?'Просроченные задачи':filter==='done'?'Выполненные задачи':filter==='active'?'Задачи в работе':'Реестр задач'}<span className="counttitle">{filtered.length} из {base.length}</span></h3>
          <select aria-label="Направление" className="input" style={{width:'auto',maxWidth:'100%',fontSize:13}} value={cat} onChange={e=>Cat(e.target.value)}>
            <option value="">Все направления</option>
            {CATS.map(c=><option key={c}>{c}</option>)}
          </select>
        </div>
        {mode==='list'?(filtered.length?<div className="taskgrid">{filtered.map(taskCard)}</div>:<Empty>Задач по выбранным условиям нет</Empty>):<div className="kanban">{STATES.map(st=><section className="column" key={st}><div className="between columnhead"><span className={'chip '+statusColor(st)}>{st}</span><span className="muted">{filtered.filter(t=>t.status===st).length}</span></div>{filtered.filter(t=>t.status===st).map(taskCard)}{!filtered.some(t=>t.status===st)&&<Empty>Нет задач</Empty>}</section>)}</div>}
      </>}

      {/* Вкладка 2: Отчёты */}
      {tab==='reports'&&manager&&<>
        <div className="between pagehead">
          <div><p className="eyebrow">Данные и результаты</p><h1>Отчёты и аналитика</h1><p className="subtitle">Период реестра — по дате создания задачи. Динамика закрытия — по дате завершения.</p></div>
          <Btn icon="download" onClick={exportCSV}>CSV / Excel</Btn>
        </div>
        <div className="filters">
          <Select value={year} onChange={Y} options={[{value:'all',label:'Все годы'},...Array.from(new Set([...Array.from({length:5},(_,i)=>new Date().getFullYear()+i),...db.tasks.map(t=>new Date(t.created_at).getFullYear()).filter(Number.isFinite)])).sort().map(y=>({value:String(y),label:String(y)}))]}/>
          <Select value={month} onChange={Mo} options={[{value:'all',label:'Все месяцы'},...MONTHS.map((m,i)=>({value:String(i),label:m}))]}/>
          <Select value={cat} onChange={Cat} options={[{value:'',label:'Все направления'},...CATS]}/>
          <Select value={reportStatus} onChange={RS} options={[{value:'',label:'Все статусы'},...STATES]}/>
          <Btn onClick={()=>{Y('all');Mo('all');RS('');Cat('');Filter('all')}}>Сбросить фильтры</Btn>
        </div>
        <p className="connection" style={{marginBottom:16}}>Отображено: <strong>{reportList.length}</strong> из <strong>{allowedTasks.length}</strong> общих задач компании.</p>
        {kpis(reportBase)}
        <div className="charts">
          <ChartPanel title="Динамика закрытия" type="line" labels={MONTHS.map(m=>m.slice(0,3))} data={MONTHS.map((_,m)=>reportBase.filter(t=>t.status==='Выполнена'&&t.completed_at&&new Date(t.completed_at).getMonth()===m).length)}/>
          <ChartPanel title="Нагрузка по направлениям" type="bar" labels={CATS} data={CATS.map(c=>reportBase.filter(t=>t.category===c).length)} colors="#38bdf8"/>
          <ChartPanel title="Структура статусов" type="doughnut" labels={STATES} data={STATES.map(s=>reportBase.filter(t=>t.status===s).length)} colors={['#52647d','#38bdf8','#a78bfa','#10b981']}/>
        </div>
        <h2 className="sectiontitle">Реестр задач <span className="counttitle">{reportList.length}</span></h2>
        {reportList.length?<div className="taskgrid">{reportList.map(taskCard)}</div>:<Empty>Нет задач для выбранного фильтра</Empty>}

        {/* Рейтинг команды строго внизу отчётов */}
        <h2 className="sectiontitle" style={{marginTop:36}}>Рейтинг команды <span className="counttitle">{assignees(db.users).length} исполнителей</span></h2>
        <div className="glass tablewrap">
          <table>
            <thead><tr><th>Участник</th><th>Всего</th><th>Выполнено</th><th>Просрочено</th><th>KPI</th></tr></thead>
            <tbody>
              {assignees(db.users).map(u=>{let tasks=reportBase.filter(t=>t.assignee===u.name),done=tasks.filter(t=>t.status==='Выполнена').length;return {u,tasks,done,kpi:tasks.length?Math.round(done/tasks.length*100):0}}).sort((a,b)=>b.kpi-a.kpi||b.done-a.done).map(({u,tasks,done,kpi},i)=><tr key={u.id}>
                <td><span className="row"><span className="muted" style={{width:18}}>{i+1}</span><span className="avatar">{initials(u.name)}</span>{u.name}</span></td>
                <td>{tasks.length}</td><td style={{color:'#6ee7b7'}}>{done}</td><td style={{color:'#fb7185'}}>{tasks.filter(overdue).length}</td><td><span className="chip emerald">{tasks.length?kpi+'%':'—'}</span></td>
              </tr>)}
            </tbody>
          </table>
        </div>
      </>}

      {/* Вкладка 3: Сезонные цели */}
      {tab==='goals'&&<>
        <div className="between pagehead">
          <div><p className="eyebrow">Большие планы</p><h1>Сезонные цели</h1><p className="subtitle">Общий вектор и персональный вклад.</p></div>
          {manager&&<Btn kind="primary" icon="plus" onClick={()=>Q({type:'goal'})}>Добавить цель</Btn>}
        </div>
        <div className="goalgrid">
          {db.goals.filter(g=>manager||g.target_type==='all'||g.assignee_name===user.name).map(g=><article key={g.id} className="glass goal">
            <div className="between"><span className={'chip '+(g.target_type==='all'?'emerald':'sapphire')}><Icon name={g.target_type==='all'?'users':'user'} size={14}/>{g.target_type==='all'?'Общая цель':g.assignee_name}</span><Icon name="target" size={22}/></div>
            <h3>{g.title}</h3><p className="muted" style={{fontSize:14}}>{g.description}</p>
            <div className="between" style={{marginTop:20}}><span className="muted" style={{fontSize:13}}>Прогресс</span><span style={{color:'#6ee7b7',fontSize:22}}>{g.progress}%</span></div>
            <div className="progress"><span style={{width:g.progress+'%'}}/></div>
            <div className="between"><span className="muted mini">Срок: {fmt(g.deadline)}</span>{Number(g.progress)===100&&<span className="chip emerald">Достигнута</span>}</div>
            {manager&&<div className="taskactions"><Btn icon="sliders-horizontal" onClick={()=>Q({type:'goal',goal:g})}>Изменить</Btn><Btn kind="danger" icon="trash-2" onClick={()=>Q({type:'deleteGoal',goal:g})}/></div>}
          </article>)}
        </div>
      </>}

      {/* Вкладка 4: Идеи и Заметки */}
      {tab==='ideas'&&<div className="stack">
        <div className="between pagehead">
          <div><p className="eyebrow">Инициативы</p><h1>Идеи и заметки</h1><p className="subtitle">Сохраняйте идеи для развития и личные заметки.</p></div>
          <Btn kind="primary" icon="plus" onClick={()=>Q({type:ideaTab==='ideas'?'idea':'note'})}>{ideaTab==='ideas'?'Предложить идею':'Новая заметка'}</Btn>
        </div>
        <div className="segment">
          <button className={ideaTab==='ideas'?'active':''} onClick={()=>IT('ideas')}><Icon name="lightbulb" size={16}/>Банк идей <span className="badge">{pending}</span></button>
          <button className={ideaTab==='notes'?'active':''} onClick={()=>IT('notes')}><Icon name="notebook-pen" size={16}/>Личный блокнот</button>
        </div>
        {ideaTab==='ideas'?<div className="ideagrid">{db.ideas.map(i=><article className="glass idea" key={i.id}>
          <div className="between"><span className={'chip '+(i.status==='На рассмотрении'?'amber':i.status==='Принята'?'emerald':'')}>{i.status}</span><small className="muted">{fmt(i.created_at)}</small></div>
          <h3>{i.title}</h3><p>{i.text}</p>
          <div className="between taskfooter"><span className="row muted" style={{fontSize:13}}><span className="avatar">{initials(i.author)}</span>{i.author}</span><Btn icon="thumbs-up" kind={(i.likes||[]).includes(user.login)?'emerald':''} onClick={()=>commit(d=>({...d,ideas:d.ideas.map(x=>x.id===i.id?{...x,likes:(x.likes||[]).includes(user.login)?x.likes.filter(l=>l!==user.login):[...(x.likes||[]),user.login]}:x)}))}>{i.likes_count??(i.likes||[]).length}</Btn></div>
          {manager&&<div className="taskactions"><Btn icon="arrow-up-right" onClick={()=>Q({type:'task',idea:i})}>В задачу</Btn><select className="input" style={{width:'auto',fontSize:13}} value={i.status} onChange={e=>commit(d=>({...d,ideas:d.ideas.map(x=>x.id===i.id?{...x,status:e.target.value}:x)}))}>{['На рассмотрении','Принята','Неактуальна'].map(x=><option key={x}>{x}</option>)}</select><Btn kind="danger" icon="trash-2" onClick={()=>Q({type:'deleteIdea',idea:i})}/></div>}
        </article>)}</div>:<div className="ideagrid">{db.notes.filter(n=>n.user_login===user.login).map(n=><article className="glass idea" key={n.id}><p className="note">{n.text}</p><div className="between taskfooter"><small className="muted">{fmt(n.updated_at)}</small><div className="row"><Btn icon="pencil" onClick={()=>Q({type:'note',note:n})}/><Btn kind="danger" icon="trash-2" onClick={()=>Q({type:'deleteNote',note:n})}/></div></div></article>)}</div>}
      </div>}

      {/* Вкладка 5: Управление командой (для lobo / SuperAdmin) */}
      {tab==='team'&&admin&&<>
        <div className="between pagehead">
          <div><p className="eyebrow">Администрирование</p><h1>Управление командой</h1><p className="subtitle">Профили сотрудников, привязка Auth UID и быстрая смена паролей.</p></div>
          <Btn kind="primary" icon="user-plus" onClick={()=>Q({type:'person'})}>Добавить</Btn>
        </div>
        <div className="glass tablewrap">
          <table>
            <thead><tr><th>Пользователь</th><th>Логин</th><th>Роль</th><th>Статус</th><th>Действия</th></tr></thead>
            <tbody>
              {db.users.map(u=><tr key={u.id}>
                <td><span className="row"><span className="avatar">{initials(u.name)}</span><span>{u.name}<small className="muted" style={{display:'block'}}>{u.position}</small></span></span></td>
                <td>{u.login}</td>
                <td>{u.role==='employee'?'Сотрудник':u.login==='lobo'?'SuperAdmin':'Руководство'}</td>
                <td><span className={'chip '+(u.is_active?'emerald':'coral')}>{u.is_active?'Активен':'Отключён'}</span></td>
                <td>
                  <div className="row">
                    <Btn icon="pencil" onClick={()=>Q({type:'person',person:u})}>Изменить</Btn>
                    {/* Кнопка мгновенной смены пароля сотруднику */}
                    {u.login!=='lobo'&&<Btn icon="key-round" onClick={()=>Q({type:'resetEmployeePass',person:u})}>Пароль</Btn>}
                  </div>
                </td>
              </tr>)}
            </tbody>
          </table>
        </div>
      </>}

      <p className="footertext">team Benoy Travel · Корпоративная система команды Кавказа</p>
    </main>

    {/* Нижняя панель навигации */}
    <nav className="bottomnav">
      {[
        ['tasks','Задачи','layout-grid'],
        ...(manager?[['reports','Отчёты','chart-no-axes-combined']]:[]),
        ['goals','Цели','target'],
        ['ideas','Идеи','lightbulb'],
        ...(admin?[['team','Команда','users']]:[])
      ].map(([t,label,icon])=><button key={t} className={tab===t?'active':''} onClick={()=>switchTab(t)}><Icon name={icon} size={20}/>{label}{t==='ideas'&&pending>0&&<span className="badge">{pending}</span>}</button>)}
    </nav>

    {/* Модальные окна */}
    {modal&&<Modal title={{
      task:modal.task?'Редактировать задачу':'Назначить задачу',
      goal:modal.goal?'Изменить цель':'Добавить цель',
      reject:'Вернуть на доработку',
      deleteTask:'Удалить задачу без следа?',
      deleteGoal:'Удалить цель?',
      deleteIdea:'Удалить идею?',
      deleteNote:'Удалить заметку?',
      idea:'Предложить идею',
      note:modal.note?'Редактировать заметку':'Новая заметка',
      profile:'Ваш профиль',
      password:'Сменить пароль',
      system:'Система и состояние базы данных',
      person:modal.person?'Изменить пользователя':'Добавить пользователя',
      resetEmployeePass:modal.person?'Смена пароля сотрудника':'Смена пароля',
      connection:'Подключение рабочей базы'
    }[modal.type]} close={close}>
      {modal.type==='task'&&manager&&<TaskForm task={modal.task} idea={modal.idea} users={db.users} close={close} save={saveTask}/>}
      {modal.type==='goal'&&manager&&<GoalForm goal={modal.goal} users={db.users} close={close} save={g=>{commit(d=>({...d,goals:modal.goal?d.goals.map(x=>x.id===modal.goal.id?{...x,...g}:x):[...d.goals,{...g,id:uid()}]}));close();notify('Цель сохранена');}}/>}
      {modal.type==='reject'&&manager&&<TextForm label="Что нужно доработать?" close={close} button="Вернуть в работу" save={reason=>{updateTask(modal.task,{status:'В работе',completed_at:null,rejection_reason:reason,history:[...(modal.task.history||[]),audit(user,'Возврат на доработку: '+reason)]});close();}}/>}
      {modal.type.startsWith('delete')&&<><p className="muted">Запись будет удалена без возможности восстановления.</p><div className="modalfoot"><Btn onClick={close}>Отмена</Btn><Btn kind="danger" icon="trash-2" onClick={()=>{const map={deleteTask:['tasks',modal.task,admin],deleteGoal:['goals',modal.goal,manager],deleteIdea:['ideas',modal.idea,manager],deleteNote:['notes',modal.note,modal.note?.user_login===user.login]};const [key,item,ok]=map[modal.type];if(ok)commit(d=>({...d,[key]:d[key].filter(x=>x.id!==item.id)}));close();notify(ok?'Удалено':'Недостаточно прав');}}>Удалить</Btn></div></>}
      {modal.type==='idea'&&<IdeaForm close={close} save={f=>{commit(d=>({...d,ideas:[{...f,id:uid(),author:user.name,user_login:user.login,status:'На рассмотрении',likes:[],created_at:iso()},...d.ideas]}));close();notify('Идея отправлена');}}/>}
      {modal.type==='note'&&<TextForm label="Личная заметка" initial={modal.note?.text||''} close={close} save={text=>{commit(d=>({...d,notes:modal.note?d.notes.map(n=>n.id===modal.note.id&&n.user_login===user.login?{...n,text,updated_at:iso()}:n):[{id:uid(),user_login:user.login,text,updated_at:iso()},...d.notes]}));close();notify('Заметка сохранена');}}/>}
      {modal.type==='system'&&admin&&<SystemOverviewView close={close}/>}
      {modal.type==='person'&&admin&&<UserForm person={modal.person} users={db.users} close={close} save={p=>{commit(d=>({...d,users:modal.person?d.users.map(u=>u.id===modal.person.id?{...u,...p}:u):[...d.users,{...p,id:uid()}],tasks:d.tasks,goals:d.goals}));close();notify('Профиль обновлён');}}/>}
      
      {/* Модальное окно быстрой смены пароля сотрудника администратором */}
      {modal.type==='resetEmployeePass'&&admin&&<TextForm
        label={'Новый пароль для ' + modal.person.name + ' (логин: ' + modal.person.login + ')'}
        password
        close={close}
        button="Сохранить новый пароль"
        save={async newPass=>{
          try{
            const {error}=await sb.rpc('benoy_admin_reset_password',{p_user_login:modal.person.login,p_new_password:newPass});
            if(error) throw error;
            close();
            notify('Пароль для ' + modal.person.name + ' успешно изменён');
          }catch(err){
            notify(err.message||'Не удалось изменить пароль');
          }
        }}
      />}

      {modal.type==='profile'&&<div className="stack">
        <div className="row"><span className="avatar" style={{width:50,height:50,fontSize:18}}>{initials(user.name)}</span><div><h3>{user.name}</h3><p className="muted">{user.login} · {admin?'SuperAdmin':manager?'Руководство':'Сотрудник'}</p></div></div>
        {admin&&<Btn icon="users" onClick={()=>{switchTab('team');close();}}>Управление командой</Btn>}
        {admin&&<Btn icon="server" kind="primary" onClick={()=>Q({type:'system'})}>Состояние системы и БД</Btn>}
        <Btn icon="key-round" onClick={()=>Q({type:'password'})}>Сменить свой пароль</Btn>
        <Btn kind="danger" icon="log-out" onClick={async()=>{await sb.auth.signOut();D(blankDB());L(null);close();}}>Выйти</Btn>
      </div>}
      {modal.type==='password'&&<TextForm label="Новый личный пароль" password close={close} save={async p=>{const {error}=await sb.auth.updateUser({password:p});if(error){notify(connectionError(error));return;}close();notify('Пароль изменён');}}/>}
      {modal.type==='connection'&&<Connection/>}
    </Modal>}
    {toast&&<div className="toast" role="status">{toast}</div>}
  </>;
}

function IdeaForm({save,close}){
  const [title,T]=useState(''),[text,S]=useState('');
  return <form className="stack" onSubmit={e=>{e.preventDefault();if(title.trim()&&text.trim())save({title:title.trim(),text:text.trim()})}}>
    <Field label="Название"><input required className="input" value={title} onChange={e=>T(e.target.value)}/></Field>
    <Field label="Суть идеи"><textarea required className="input" value={text} onChange={e=>S(e.target.value)}/></Field>
    <div className="modalfoot"><Btn onClick={close}>Отмена</Btn><button className="btn primary">Предложить</button></div>
  </form>
}

function Connection(){
  return <div className="stack">
    <p>Система team Benoy Travel работает напрямую с базой данных Supabase (PostgreSQL).</p>
    <p className="connection">Если данные не загружаются, убедитесь, что проект в панели Supabase переведён в статус Active (нажата кнопка Unpause).</p>
  </div>;
}

function Login({onLogin,connection,errorMessage}){
  const [identifier,setId]=useState('');
  const [password,setP]=useState('');
  const [error,setErr]=useState('');
  const [busy,setBusy]=useState(false);

  async function handleLogin(e){
    e.preventDefault();
    setBusy(true);
    setErr('');
    try{
      if(!sb) throw Error('Клиент Supabase не инициализирован.');
      let loginTarget=identifier.trim();
      
      // Разрешение логина сотрудника в email Supabase Auth
      if(!loginTarget.includes('@')){
        try{
          const {data:resolved}=await sb.rpc('benoy_resolve_login',{p_login:loginTarget});
          if(resolved) loginTarget=resolved;
          else loginTarget=loginTarget.toLowerCase()+'@benoytravel.team';
        }catch(rpcErr){
          loginTarget=loginTarget.toLowerCase()+'@benoytravel.team';
        }
      }

      const {error}=await sb.auth.signInWithPassword({email:loginTarget,password});
      if(error) throw error;
      await onLogin();
      setP('');
    }catch(err){
      setErr(err?.message?.includes('Invalid login')||err?.code==='invalid_credentials'?'Неверный логин/почта или пароль':connectionError(err));
    }finally{
      setBusy(false);
    }
  }

  return <main className="glass login">
    <div className="row">
      <img className="brand-logo" src="./assets/benoy-travel-logo.png" width="56" height="56" alt="team Benoy Travel"/>
      <div className="brand">team Benoy Travel<small>КОРПОРАТИВНАЯ СИСТЕМА</small></div>
    </div>
    <h1>Вход в рабочее пространство</h1>
    <p className="muted" style={{fontSize:14}}>Используйте логин сотрудника или email администратора.</p>
    
    <form onSubmit={handleLogin}>
      <Field label="Логин или почта">
        <input type="text" required autoComplete="username" className="input" placeholder="Например: iskhak или email" value={identifier} onChange={e=>setId(e.target.value)}/>
      </Field>
      <Field label="Пароль">
        <input type="password" required autoComplete="current-password" className="input" placeholder="Введите пароль" value={password} onChange={e=>setP(e.target.value)}/>
      </Field>
      {(error||errorMessage)&&<p className="error" role="alert">{error||errorMessage}</p>}
      <button disabled={busy} className="btn primary" style={{width:'100%',marginTop:18}}>{busy?'Проверяем…':'Войти'}</button>
    </form>
    <button className="btn" style={{marginTop:14,width:'100%'}} onClick={connection}>Статус подключения</button>
  </main>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
